[package]
name = "leet-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "NL↔1337 bridge layer: projector, heuristics, Claude adapter"
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/leet-bridge"
readme = "README.md"
exclude = ["calibration/data/*", "tests/fixtures/*"]

[features]
default = []
keyword-fallback = []  # enables legacy nl_translator rules as fallback when W.bin is missing

[dependencies]
leet-core = { path = "../leet-core", version = "1.0.0" }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"
