[package]
name = "leet-core"
version = "0.4.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
thiserror = "2"
crc32fast = "1.3"

[dependencies.pyo3]
version = "0.22"
optional = true
features = ["extension-module"]

[features]
default = []
python = ["pyo3"]

[dev-dependencies]
serde_json = "1"
