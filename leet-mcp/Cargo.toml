[package]
name = "leet-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Model Context Protocol server exposing 1337 tools to Claude Code and other MCP clients"
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/leet-mcp"
readme = "README.md"

[lib]
name = "leet_mcp"
path = "src/lib.rs"

[[bin]]
name = "leet-mcp"
path = "src/main.rs"

[dependencies]
leet-core = { path = "../leet-core", version = "1.0.0" }
leet-bridge = { path = "../leet-bridge", version = "1.0.0", features = ["keyword-fallback"] }

tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

uuid = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
