[package]
name = "leet-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line tools for debugging, inspecting, and benchmarking 1337"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "leet"
path = "src/main.rs"

[dependencies]
leet-core = { path = "../leet-core" }
leet-bridge = { path = "../leet-bridge", features = ["keyword-fallback"] }
leet-mcp = { path = "../leet-mcp" }
leet-service = { path = "../leet-service" }
clap = { version = "4", features = ["derive"] }
crossterm = "0.27"
serde_json = "1"
colored = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.11", features = ["blocking"] }
indicatif = "0.17"

[dependencies.anyhow]
workspace = true

[dependencies.serde]
workspace = true
features = ["derive"]

[dev-dependencies]
tempfile = "3"
